name: Bundle supplied hoodie base
on:
  push:
    branches: [main]
    paths: [.github/workflows/bundle-hoodie-base.yml]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and verify supplied base
        env:
          HOODIE_SOURCE: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-09a0-81f5-b738-04444a10645c/raw?se=2026-11-16T21%3A55%3A06Z&sp=r&sv=2026-06-06&sr=b&scid=1c88ebdd-427f-4d6d-8abf-7d28451a25fa&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-16T12%3A45%3A26Z&ske=2026-11-17T12%3A45%3A26Z&sks=b&skv=2026-06-06&sig=/UFjonwRYQC31p5q1s28AOAlBkCyHSqQm/ZSyyNF/Zs%3D"
        run: |
          python3 - <<'PY'
          import os, urllib.request, hashlib, pathlib, zipfile
          p=pathlib.Path("public/hoodie-base.3mf")
          urllib.request.urlretrieve(os.environ["HOODIE_SOURCE"], p)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "5e74a1b95380d8fce170618612e3a8d681f0494b5060850a8a858d20abe4c3d4"
          with zipfile.ZipFile(p) as z:
              assert "3D/3dmodel.model" in z.namelist()
          PY
      - name: Commit bundled base and remove import job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bundle-hoodie-base.yml
          git add public/hoodie-base.3mf .github/workflows/bundle-hoodie-base.yml
          git commit -m "Bundle supplied default hoodie 3MF"
          git push origin HEAD:main
